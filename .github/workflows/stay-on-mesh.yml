name: Stay on the mesh

# The called workflow (require-mesh.yml) rewrites stack-mesh.json and opens a
# pull request, so it needs write scope. A reusable workflow cannot request more
# than the caller grants, and this repository's default token is read-only, so
# without this block every run — the PR check and the scheduled sync alike —
# dies at startup before any job begins. That is exactly how a stale mesh
# survived for weeks with nothing reporting it.
permissions:
  contents: write
  pull-requests: write

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "29 * * * *"
  workflow_dispatch:

jobs:
  require:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    uses: Pukujan/agent-stack-train/.github/workflows/require-mesh.yml@main
    with:
      component: agent-custom-setup

  update:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    uses: Pukujan/agent-stack-train/.github/workflows/require-mesh.yml@main
    with:
      component: agent-custom-setup
      write: true
    secrets:
      # Optional. Without it the pull request is opened with github.token and
      # its checks wait for a human approval; with it the sync runs unattended.
      MESH_SYNC_TOKEN: ${{ secrets.MESH_SYNC_TOKEN }}
