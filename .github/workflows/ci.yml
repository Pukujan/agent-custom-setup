name: ci

# Required status check for PCM-governed merges into main (ACS-0002).
# Reproducible machine gates: pinned PCM continuity validate+preflight,
# no committed secrets, config templates parse, extensions syntax-check.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    env:
      PCM_PIN: 743d50ede188eb0cd5457967a041880e2ff4cb31
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install pinned continuity CLI
        run: |
          python -m pip install --upgrade pip
          python -m pip install "git+https://github.com/Pukujan/project-continuity-modules.git@${PCM_PIN}"
          python -m pip install pyyaml
          continuity --version

      - name: Continuity validate
        run: continuity validate --root .

      - name: Continuity preflight (TARGET_VALID)
        run: continuity preflight --root .

      - name: No committed secrets (tracked tree)
        run: |
          if git grep -nIE 'sk-or-[A-Za-z0-9]|yolo_[A-Za-z0-9]{4,}|api[_-]?key["'"'"']?[[:space:]]*[:=][[:space:]]*["'"'"']?[A-Za-z0-9]{20}'; then
            echo "FAIL: tracked secret-like string found"
            exit 1
          fi
          echo "OK: no committed secrets"

      - name: Config templates parse (YAML/JSON)
        run: |
          python - <<'PY'
          import glob, json, sys, yaml
          files = sorted(glob.glob("oh-my-pi/config/*.yml")) + sorted(glob.glob("oh-my-pi/config/*.json"))
          for f in files:
              with open(f, encoding="utf-8") as fh:
                  (json.load if f.endswith(".json") else yaml.safe_load)(fh)
              print("OK", f)
          print(f"OK: {len(files)} template(s) parse")
          PY

      - name: Extension TypeScript syntax check
        run: |
          shopt -s nullglob
          for ts in oh-my-pi/extensions/*.ts; do
            node --check "$ts"
            echo "OK $ts"
          done
